name: Dev build

# Every merge to dev builds and pushes the :dev image.
# Pushing :dev deploys nothing: redeploy the dev stack in Portainer
# (masjid-guide-dev, "Update the stack" with "Re-pull image" on).
# Masjid stacks never use :dev; they run versioned images from Release.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to dev supersedes a build still in progress.
concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/isquare-tech-solutions-uk/masjidguide-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only :dev, no :<sha> tag: every tagged version counts toward the
      # "keep 30" window in cleanup.yml, which is meant for releases.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Dev build"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE:dev\`"
            echo ""
            echo "Nothing was deployed. Redeploy masjid-guide-dev in Portainer with \"Re-pull image\" on."
          } >> "$GITHUB_STEP_SUMMARY"
