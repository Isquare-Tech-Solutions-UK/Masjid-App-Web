name: Clean up old images

on:
  schedule:
    # Sundays 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: masjidguide-frontend
          package-type: container
          min-versions-to-keep: 30
